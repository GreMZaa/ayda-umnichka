<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Код подтверждения</title>
</head>
<body style="margin:0;padding:0;background:#FFF7EE;-webkit-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Код для подтверждения действия</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FFF7EE;padding:36px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background:#FFFFFF;border:1px solid #F2DECE;border-radius:24px;overflow:hidden;">
          <tr>
            <td style="background:#FDEFEA;padding:24px 32px 20px;text-align:center;border-bottom:1px solid #F2DECE;">
              <img src="https://lk-ayda-um.vercel.app/images/logo-official.jpg" alt="АйДаУмничка" width="168" style="display:block;margin:0 auto 14px;max-width:168px;width:168px;height:auto;border:0;outline:none;text-decoration:none;" />
              <div style="font-size:11px;font-weight:600;color:#6B758E;text-transform:uppercase;letter-spacing:0.08em;">личный кабинет</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px 8px;">
              <h1 style="margin:0;font-size:20px;font-weight:800;color:#161F38;line-height:1.3;">Код подтверждения</h1>
              <p style="margin:16px 0 0;font-size:14px;line-height:1.65;color:#54607B;">Для продолжения введите одноразовый код:</p>
<p style="margin:16px 0 0;font-size:14px;line-height:1.65;color:#54607B;"><span style="display:inline-block;margin-top:8px;padding:12px 20px;background:#FFFBF7;border:2px dashed #F2C79E;border-radius:12px;font-size:28px;font-weight:800;letter-spacing:0.2em;color:#161F38;font-family:ui-monospace,Consolas,monospace;">{{ .Token }}</span></p>
<p style="margin:16px 0 0;font-size:14px;line-height:1.65;color:#54607B;">Код действует недолго. Никому его не сообщайте.</p>
            </td>
          </tr>
          
          <tr>
            <td style="background:#FFFBF7;border-top:1px solid #F2DECE;padding:18px 32px 22px;text-align:center;">
              <p style="margin:0;font-size:10px;line-height:1.5;color:#9E9085;">Если вы не выполняли действие в кабинете, смените пароль и свяжитесь с поддержкой.</p>
              <p style="margin:10px 0 0;font-size:10px;color:#C5C9D4;">© АйДаУмничка</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
