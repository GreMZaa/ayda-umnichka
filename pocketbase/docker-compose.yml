version: "3.8"

services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pocketbase-umnichka
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - pb_data:/pb/pb_data
    environment:
      - PB_ENCRYPTION_KEY= # optional encryption key

volumes:
  pb_data:
