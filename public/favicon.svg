<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Bright Sapphire to Deep Electric Indigo -->
    <linearGradient id="bgGrad" x1="40" y1="20" x2="472" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Top Ambient Gloss Overlay -->
    <linearGradient id="topGloss" x1="256" y1="16" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Radiant Gold Gradients for Tassel & Stars -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Cap Shading Gradients -->
    <linearGradient id="capTop" x1="96" y1="130" x2="416" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="capFrontFacet" x1="256" y1="204" x2="256" y2="254" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="capBand" x1="174" y1="230" x2="338" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <!-- Book Pages Gradients -->
    <linearGradient id="bookPageL" x1="88" y1="288" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="bookPageR" x1="424" y1="288" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="underPage" x1="256" y1="330" x2="256" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- 1. Background Squircle with High-End Glass Bevel -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <path d="M16 128C16 66.1401 66.1401 16 128 16H384C445.86 16 496 66.1401 496 128V240C496 240 380 280 256 280C132 280 16 240 16 240V128Z" fill="url(#topGloss)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- 2. Decorative Center Glow -->
  <circle cx="256" cy="250" r="140" fill="#ffffff" opacity="0.07" />

  <!-- 3. OPEN BOOK WINGS OF KNOWLEDGE (Foundation of Education) -->
  <g id="open-book">
    <!-- Underpage Wings Accent -->
    <path d="M256 392C204 402 140 382 104 362C104 354 116 338 116 338C152 356 210 370 256 374C302 370 360 356 396 338C396 338 408 354 408 362C372 382 308 402 256 392Z" fill="url(#underPage)" />
    
    <!-- Left Main Page -->
    <path d="M256 374C198 382 130 358 96 334L114 290C152 312 212 334 256 336V374Z" fill="url(#bookPageL)" />
    <!-- Left Page Line details -->
    <path d="M136 312C168 326 208 338 242 342" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.45" />
    <path d="M148 328C176 340 210 350 242 354" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.45" />

    <!-- Right Main Page -->
    <path d="M256 374C314 382 382 358 416 334L398 290C360 312 300 334 256 336V374Z" fill="url(#bookPageR)" />
    <!-- Right Page Line details -->
    <path d="M376 312C344 326 304 338 270 342" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.45" />
    <path d="M364 328C336 340 302 350 270 354" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.45" />

    <!-- Book Spine Ribbon Bookmark (Golden) -->
    <path d="M252 336H260V410L256 404L252 410V336Z" fill="url(#goldGrad)" />
  </g>

  <!-- 4. ACADEMIC GRADUATION CAP -->
  <g id="graduation-cap">
    <!-- Cap Skullcap Base -->
    <path d="M172 238C172 292 340 292 340 238C314 260 198 260 172 238Z" fill="url(#capBand)" />
    <path d="M190 250C214 274 298 274 322 250" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.4" />

    <!-- Cap Diamond: Top Facet (White/Crisp) -->
    <polygon points="256,128 416,202 256,238 96,202" fill="url(#capTop)" />
    <!-- Cap Diamond: Front-Facing 3D Edge Bevel -->
    <polygon points="96,202 256,238 416,202 256,252" fill="url(#capFrontFacet)" />
    <polygon points="256,238 416,202 416,206 256,252" fill="#94a3b8" />

    <!-- Center Button on top of cap -->
    <ellipse cx="256" cy="202" rx="10" ry="6.5" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2" />

    <!-- Golden Tassel draping gracefully to the right -->
    <path d="M256 202C312 202 384 218 396 248" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <circle cx="396" cy="254" r="6" fill="url(#goldGrad)" />
    <!-- Tassel Fringe Body -->
    <path d="M391 258H401L405 304H387L391 258Z" fill="url(#goldGrad)" />
    <!-- Individual Tassel strands for texture -->
    <line x1="390" y1="304" x2="390" y2="310" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
    <line x1="394" y1="304" x2="394" y2="313" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <line x1="398" y1="304" x2="398" y2="313" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <line x1="402" y1="304" x2="402" y2="310" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 5. RADIANT 4-POINTED STAR OF EXCELLENCE («Умничка!») -->
  <g transform="translate(406, 110)">
    <!-- Star Halo -->
    <circle cx="0" cy="0" r="32" fill="#fde047" opacity="0.3" />
    <!-- Star Rays -->
    <path d="M0 -36 Q0 0 36 0 Q0 0 0 36 Q0 0 -36 0 Q0 0 0 -36Z" fill="url(#goldStar)" stroke="#ffffff" stroke-width="2.5" />
    <!-- Star Diamond Center Glow -->
    <circle cx="0" cy="0" r="5.5" fill="#ffffff" />
  </g>

  <!-- Tiny Sparkle Accent Top Left -->
  <g transform="translate(106, 126)">
    <circle cx="0" cy="0" r="16" fill="#ffffff" opacity="0.2" />
    <path d="M0 -16 Q0 0 16 0 Q0 0 0 16 Q0 0 -16 0 Q0 0 0 -16Z" fill="#ffffff" opacity="0.9" />
  </g>
</svg>